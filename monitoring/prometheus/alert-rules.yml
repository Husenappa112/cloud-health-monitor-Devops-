groups:
  - name: cloud-health-monitor-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job=~"cloud-health-monitor(-kubernetes)?"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cloud Health Monitor application is down"
          description: "Prometheus cannot scrape the application."

      - alert: HighResponseTime
        expr: max by (job, instance) (http_server_requests_seconds_max{job=~"cloud-health-monitor(-kubernetes)?",uri!="/actuator/prometheus"}) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP response time"
          description: "An observed HTTP request duration exceeded 2 seconds."

      - alert: HighCPUUsage
        expr: process_cpu_usage{job=~"cloud-health-monitor(-kubernetes)?"} > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High application CPU usage"
          description: "Application process CPU usage exceeded 80%."

      - alert: HighJvmMemoryUsage
        expr: (sum by (job, instance) (jvm_memory_used_bytes{job=~"cloud-health-monitor(-kubernetes)?",area="heap"}) / sum by (job, instance) (jvm_memory_max_bytes{job=~"cloud-health-monitor(-kubernetes)?",area="heap"})) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "JVM heap usage exceeded 80%."

  - name: monitored-url-health-alerts
    rules:
      - alert: MonitoredServiceDown
        expr: monitored_service_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitored URL service is DOWN: {{ $labels.service }}"
          description: "Target URL service {{ $labels.service }} is unreachable, returned an error status, or failed connectivity checks."

      - alert: MonitoredServiceLatencyHigh
        expr: monitored_service_response_time_seconds > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Monitored URL service latency degraded: {{ $labels.service }}"
          description: "Service {{ $labels.service }} response time is {{ $value }}s, exceeding the 2.0s threshold."

      - alert: MonitoredServiceDegraded
        expr: monitored_service_up == 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Monitored URL service is DEGRADED: {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing performance degradation, slow responses, or SSL warning."

      - alert: SslCertificateExpiringSoon
        expr: monitored_service_ssl_expiry_days > 0 and monitored_service_ssl_expiry_days < 7
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.service }}"
          description: "SSL certificate for service {{ $labels.service }} expires in {{ $value }} days."

      - alert: SslCertificateExpired
        expr: monitored_service_ssl_expiry_days == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate EXPIRED for {{ $labels.service }}"
          description: "SSL certificate for service {{ $labels.service }} has expired! Immediate renewal required."

      - alert: DnsLookupLatencyHigh
        expr: monitored_service_dns_lookup_seconds > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DNS resolution slow for {{ $labels.service }}"
          description: "DNS resolution duration for service {{ $labels.service }} is {{ $value }}s, exceeding 500ms."
