---
# tasks/main.yml — Cloud Health Monitor deployment role

- name: Install Docker (Debian/Ubuntu)
  block:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      notify: Start Docker service

  when: ansible_os_family == "Debian"

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: pull
  when: docker_pull | default(false)

- name: Stop existing container (if running)
  community.docker.docker_container:
    name: "{{ docker_container_name }}"
    state: absent
  ignore_errors: true

- name: Run Cloud Health Monitor container
  community.docker.docker_container:
    name: "{{ docker_container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: "{{ docker_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
    env:
      JAVA_OPTS: "{{ java_opts | default('') }}"
  notify: Verify application health

- name: Wait for application to become healthy
  ansible.builtin.uri:
    url: "{{ health_check_url }}"
    return_content: false
    status_code: 200
  register: health_response
  retries: "{{ health_check_retries }}"
  delay: "{{ health_check_delay }}"
  until: health_response.status == 200
