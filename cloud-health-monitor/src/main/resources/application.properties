spring.application.name=cloud-health-monitor
server.port=8081

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true

# Database Persistence (H2 default, overridable with env vars / PostgreSQL profile)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cloudhealth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Health Monitoring Engine Configuration
monitor.connect-timeout-ms=3000
monitor.request-timeout-ms=5000
monitor.scheduler.pool-size=10
monitor.scheduler.default-interval-seconds=60
monitor.allow-private-ips=false
