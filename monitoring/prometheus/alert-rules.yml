groups:
  - name: cloud-health-monitor-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job=~"cloud-health-monitor(-kubernetes)?"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cloud Health Monitor application is down"
          description: "Prometheus cannot scrape the application."

      - alert: HighResponseTime
        expr: max by (job, instance) (http_server_requests_seconds_max{job=~"cloud-health-monitor(-kubernetes)?",uri!="/actuator/prometheus"}) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP response time"
          description: "An observed HTTP request duration exceeded 2 seconds."

      - alert: HighCPUUsage
        expr: process_cpu_usage{job=~"cloud-health-monitor(-kubernetes)?"} > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High application CPU usage"
          description: "Application process CPU usage exceeded 80%."

      - alert: HighJvmMemoryUsage
        expr: (sum by (job, instance) (jvm_memory_used_bytes{job=~"cloud-health-monitor(-kubernetes)?",area="heap"}) / sum by (job, instance) (jvm_memory_max_bytes{job=~"cloud-health-monitor(-kubernetes)?",area="heap"})) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "JVM heap usage exceeded 80%."
