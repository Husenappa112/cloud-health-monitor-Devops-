apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-health-monitor
  labels:
    app: cloud-health-monitor
    version: "0.0.1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-health-monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloud-health-monitor
        version: "0.0.1"
    spec:
      containers:
        - name: cloud-health-monitor
          # For Minikube: load the local image with
          #   minikube image load cloud-health-monitor:latest
          # then set imagePullPolicy: Never
          image: cloud-health-monitor:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 10
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
