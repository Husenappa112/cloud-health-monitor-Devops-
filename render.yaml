services:
  # Spring Boot Backend Web Service
  - type: web
    name: cloud-health-monitor-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-health-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONITOR_ALLOW_PRIVATE_IPS
        value: "false"

databases:
  # Render PostgreSQL Database (Free Tier)
  - name: cloud-health-db
    plan: free
    region: oregon
    databaseName: cloudhealth
    user: cloudhealth_user
