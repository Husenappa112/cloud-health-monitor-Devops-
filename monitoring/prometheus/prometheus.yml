global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "chm-alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "cloud-health-monitor"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "chm-prometheus-test-20261115:8081"

  - job_name: "cloud-health-monitor-kubernetes"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:30081"
