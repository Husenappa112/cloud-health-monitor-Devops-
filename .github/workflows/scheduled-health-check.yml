name: Scheduled — Nightly Health Check & Dependency Audit

on:
  schedule:
    - cron: '0 0 * * *'   # Every day at midnight UTC
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. Nightly Build Verification
  # ─────────────────────────────────────────────
  nightly-build:
    name: Nightly Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Full build & test
        run: ./mvnw clean verify

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Nightly build failed — ${new Date().toISOString().split('T')[0]}`,
              body: `The nightly CI build failed.\n\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate.`,
              labels: ['bug', 'nightly-failure']
            })

  # ─────────────────────────────────────────────
  # 2. Dependency Vulnerability Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP NVD check
        run: ./mvnw org.owasp:dependency-check-maven:aggregate -DfailBuildOnCVSS=7 || true

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dep-check-${{ github.run_number }}
          path: target/dependency-check-report.html
          retention-days: 30
